<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 64" role="img" aria-label="Geek Financiero">
  <title>Geek Financiero</title>
  <!-- Isotipo: la deuda bajando escalón por escalón hasta tocar el suelo.
       Los pasos rectos leen como píxeles (geek) y como un saldo que cae (financiero). -->
  <g transform="translate(4 8)">
    <path d="M6 6 V19 H19 V32 H32 V45 H45"
          fill="none" stroke="#009184" stroke-width="6.5"
          stroke-linecap="round" stroke-linejoin="round"/>
    <!-- el punto donde la deuda llega a cero -->
    <circle cx="45" cy="45" r="5.5" fill="#009184"/>
    <!-- el crédito como iba: la recta que nunca baja del todo -->
    <path d="M6 6 L45 45" fill="none" stroke="#c1571f" stroke-width="2.4"
          stroke-linecap="round" opacity=".55" stroke-dasharray="4 5"/>
  </g>
  <text x="76" y="41" font-family="Fraunces, Georgia, serif" font-weight="600"
        font-size="30" letter-spacing="-0.6" fill="#1b1710">Geek<tspan fill="#009184"> Financiero</tspan></text>
</svg>
