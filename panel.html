<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Panel · Geek Financiero</title>
<meta name="robots" content="noindex,nofollow">
<!-- El panel enseña texto que escriben desconocidos (los reclamos). Con esto el
     navegador se niega a ejecutar cualquier script que se cuele en esos datos:
     no hay 'unsafe-inline' en script-src, así que un onerror= inyectado no corre. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src https://geekfinanciero-api.geekfinanciero.workers.dev; img-src 'self' data:; font-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'">
<link rel="icon" type="image/png" sizes="32x32" href="/icono-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/icono-16.png">
<link rel="apple-touch-icon" href="/icono-180.png">
<link rel="stylesheet" href="/legal.css">
<style>
  .hoja{max-width:1040px}
  .cabecera{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:6px}
  .quien{margin-left:auto;font-size:.85rem;color:var(--ink-3)}
  .rejilla{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:12px;margin:22px 0 30px}
  .dato{border:1px solid var(--rule);border-radius:12px;padding:15px 16px;background:var(--surface)}
  .dato .k{display:block;font-size:.78rem;color:var(--ink-3);font-weight:650;margin-bottom:6px}
  .dato .v{font-family:var(--ff-num);font-weight:700;font-size:1.6rem;line-height:1;letter-spacing:-.02em}
  .dato .p{display:block;font-size:.78rem;color:var(--ink-3);margin-top:6px}
  .dato.fuerte{background:var(--brand-soft);border-color:transparent}
  h2{font-size:1.1rem;margin:30px 0 12px}
  .tablawrap{overflow-x:auto;border:1px solid var(--rule);border-radius:12px}
  table{width:100%;border-collapse:collapse;font-size:.87rem;min-width:520px}
  th{text-align:left;font-weight:650;font-size:.74rem;color:var(--ink-3);padding:10px 13px;
    border-bottom:1px solid var(--rule-2);white-space:nowrap;background:var(--inset)}
  td{padding:9px 13px;border-bottom:1px solid var(--rule);white-space:nowrap}
  tr:last-child td{border-bottom:none}
  td.num{font-family:var(--ff-num);text-align:right}
  .pin{display:inline-block;font-size:.72rem;font-weight:700;border-radius:999px;padding:2px 9px}
  .pin.ok{background:var(--brand-soft);color:var(--ink)}
  .pin.no{background:var(--inset);color:var(--ink-3)}
  .pin.mal{background:#f8efd8;color:#1b1710}
  .herramienta{border:1px solid var(--rule);border-radius:12px;padding:16px 18px;background:var(--surface);
    display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}
  .campo{display:flex;flex-direction:column;gap:5px}
  .campo label{font-size:.78rem;font-weight:650;color:var(--ink-2)}
  .campo input{font:inherit;padding:9px 11px;border:1.5px solid var(--rule-2);border-radius:9px;
    background:var(--bg);color:var(--ink);min-width:190px}
  button{font:inherit;font-weight:650;font-size:.88rem;padding:10px 16px;border:none;border-radius:9px;
    background:var(--brand);color:#fff;cursor:pointer}
  button.suave{background:var(--inset);color:var(--ink)}
  button:disabled{opacity:.55;cursor:default}
  #aviso{margin-top:14px;font-size:.88rem}
  .caja{max-width:460px;margin:12vh auto;text-align:center}
  @media (prefers-color-scheme:dark){:root:where(:not([data-theme="light"])) .pin.mal{background:#2a2213;color:#f4f2ea}}
</style>
</head>
<body>
<main class="hoja" id="hoja">
  <p style="text-align:center;color:var(--ink-3);margin:12vh 0">Comprobando quién eres…</p>
</main>

<script src="/panel.js"></script>
</body>
</html>
