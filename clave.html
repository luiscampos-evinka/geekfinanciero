<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nueva contraseña · Geek Financiero</title>
<meta name="robots" content="noindex,nofollow">
<link rel="stylesheet" href="/legal.css">
<style>
  .caja{max-width:440px;margin:11vh auto;padding:0 20px}
  .marca{display:inline-flex;align-items:center;gap:10px;margin-bottom:24px}
  .marca span{font-family:var(--ff-display);font-weight:600;font-size:1.15rem;letter-spacing:-.015em}
  .marca em{font-style:normal;color:var(--brand)}
  h1{font-size:1.55rem;margin-bottom:8px}
  label{display:block;font-size:.85rem;font-weight:650;color:var(--ink-2);margin:18px 0 6px}
  input{width:100%;box-sizing:border-box;font-family:var(--ff-num);font-size:1.05rem;font-weight:600;
    padding:11px 13px;border:1.5px solid var(--rule-2);border-radius:10px;
    background:var(--surface);color:var(--ink)}
  input:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
  .hint{font-size:.78rem;color:var(--ink-3);margin-top:6px}
  button{width:100%;margin-top:20px;font:inherit;font-weight:650;font-size:.95rem;padding:12px;
    border:none;border-radius:10px;background:var(--brand);color:#fff;cursor:pointer}
  button:hover{filter:brightness(1.08)}
  button:disabled{opacity:.6;cursor:default}
  .aviso{margin-top:16px;padding:13px 15px;border-radius:10px;font-size:.88rem;line-height:1.5}
  .aviso.mal{background:#f8efd8;color:#1b1710}
  .aviso.ok{background:var(--brand-soft)}
  @media (prefers-color-scheme:dark){:root:where(:not([data-theme="light"])) .aviso.mal{background:#2a2213;color:#f4f2ea}}
  a.boton{display:inline-block;margin-top:14px;color:var(--brand);font-weight:650;font-size:.9rem}
</style>
</head>
<body>
<div class="caja">
  <div class="marca">
    <svg width="30" height="30" viewBox="0 0 52 52" aria-hidden="true">
      <path d="M6 6 V19 H19 V32 H32 V45 H45" fill="none" stroke="var(--brand)" stroke-width="6.5"
            stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="45" cy="45" r="5.5" fill="var(--brand)"/>
    </svg>
    <span>Geek<em> Financiero</em></span>
  </div>
  <div id="zona">
    <h1>Elige una contraseña nueva</h1>
    <p>La anterior deja de servir apenas guardes esta.</p>
    <label for="clave">Contraseña nueva</label>
    <input type="password" id="clave" autocomplete="new-password">
    <p class="hint">Mínimo 8 caracteres, con letras y números.</p>
    <label for="clave2">Repítela</label>
    <input type="password" id="clave2" autocomplete="new-password">
    <div id="aviso"></div>
    <button type="button" id="guardar">Guardar y entrar</button>
  </div>
</div>

<script>
(() => {
  const API = 'https://geekfinanciero-api.geekfinanciero.workers.dev';
  const t = new URLSearchParams(location.search).get('t');
  const zona = document.getElementById('zona');
  const avisar = (texto, bien) => {
    document.getElementById('aviso').innerHTML = `<div class="aviso ${bien ? 'ok' : 'mal'}">${texto}</div>`;
  };

  if (!t) {
    zona.innerHTML = `<h1>Este enlace está incompleto</h1>
      <p>Pide uno nuevo desde el simulador.</p><a class="boton" href="/">Volver al simulador</a>`;
    return;
  }

  document.getElementById('guardar').addEventListener('click', async () => {
    const c1 = document.getElementById('clave').value;
    const c2 = document.getElementById('clave2').value;
    if (c1 !== c2) return avisar('Las dos contraseñas no son iguales.');
    const b = document.getElementById('guardar');
    b.disabled = true; b.textContent = 'Guardando…';
    try {
      const r = await fetch(`${API}/api/cuenta/nueva-clave`, {
        method: 'POST', headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ token: t, clave: c1 }),
      });
      const d = await r.json();
      if (!r.ok) { b.disabled = false; b.textContent = 'Guardar y entrar'; return avisar(d.error || 'No se pudo.'); }
      // Cambiar la contraseña desconecta todos los equipos, incluido este:
      // hay que volver a entrar, y así se comprueba que la nueva funciona.
      zona.innerHTML = `<h1>Listo</h1>
        <p>Tu contraseña quedó cambiada. Por seguridad, <b>todos los equipos quedaron
        desconectados</b> — incluido este. Entra otra vez con la contraseña nueva.</p>
        <a class="boton" href="/">Ir al simulador</a>`;
      try { localStorage.removeItem('gf-sesion'); } catch (e) {}
    } catch (e) {
      b.disabled = false; b.textContent = 'Guardar y entrar';
      avisar('No pudimos conectar con el servidor.');
    }
  });
})();
</script>
</body>
</html>
